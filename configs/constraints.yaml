hard:
  sulfur_mg_kg_max: 10.0
  blend_shares_sum: 1.0
  blend_shares_tolerance: 1.0e-3

data_quality:
  # 30 ч: суточный отбор + 4 ч до публикации. При stale ЛИМС gate опирается на исправный ПАК.
  lims_max_age_minutes: 1800
  pak_max_age_minutes: 360
  require_quality_source: true

quality_source_priority:
  - lims
  - pak
  - virtual

ranking_weights:
  quality_risk: 100.0
  throughput: 10.0
  energy_or_cost_proxy: 5.0
  equipment_risk: 20.0

refuse_messages:
  stale_lims: "Надёжной рекомендации нет: последнее лабораторное значение устарело."
  no_feasible: "Надёжной рекомендации нет: доступные варианты нарушают ограничения или выходят за модельный диапазон."
  incomplete_data: "Надёжной рекомендации нет: входные данные неполны или несогласованы."
  unit_not_running: "Надёжной рекомендации нет: установка не работает — расход сырья ниже рабочего порога, режимные изменения не рассматриваются."

decision:
  # Когда рекомендовать изменение (оркестратор, Роман). Все значения — допущения.
  hold_margin: 5.0                     # на сколько единиц score изменение должно быть лучше удержания
  act_when_breach_risk_at_least: 0.5   # порог для оценки по интервалу
  # Порог для классификатора: другая шкала, поэтому значение своё. Взят с обучающего
  # периода как точка, отлавливающая половину нарушений (models/breach_classifier.json).
  act_when_breach_risk_at_least_classifier: 0.2512
  max_levers_per_action: 1             # один кандидат двигает один рычаг
