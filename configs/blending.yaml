# Блендинг товарного дизеля (Роман). Схема организаторов «Блендинг из резервуаров»
# и спецификация товарного резервуара из «Ustanovka_AVT_merged».
#
# Свойства компонентов, измеренные или рассчитанные по ЛИМС, лежат в
# models/blend_components.json (python -m scripts.analysis.blend_components).
# Здесь — только то, чего в данных нет, и параметры сценария. Меняешь этот файл —
# меняется ответ: это и есть «нежёсткий» сценарий, которого просят организаторы.

batch_t: 1000                  # размер партии товарного дизеля, т

season: summer                 # summer | winter — выбирает нормы плотности и цетанового числа

spec:
  sulfur_mg_kg_max: 10.0       # «Сера ≤ 10 мг/кг» — товарный резервуар
  t95_c_max: 360.0             # «T95 ≤ 360 °C»
  cetane_min:
    summer: 51.0               # «ДТ Летнее товарное: ЦЧ не менее 51»
    winter: 49.0               # «ДТ Зимнее товарное: ЦЧ не менее 49»
  density_kg_m3:
    summer: [820.0, 845.0]     # «Плотность 820–845»
    winter: [800.0, 845.0]     # «Плотность 800–845»

components:
  hydrotreated_diesel:
    stock_t: 1200.0            # запас в резервуаре, т — допущение, данных о запасах нет
    price_rel: 1.0             # цена тонны относительно ДТ; ценовых данных нет, все равны
  kerosene:
    stock_t: 300.0
    price_rel: 1.0
    sulfur_mg_kg: 5.0          # допущение: гидроочищенная марка, см. ASSUMPTIONS.md
  gas_oil:
    stock_t: 400.0
    price_rel: 1.0
    sulfur_mg_kg: 8.0          # допущение: гидроочищенная марка, см. ASSUMPTIONS.md

additives:
  A:
    label: "цетаноповышающая присадка"
    enabled: true
    price_rel_per_t: 100.0     # «в 100 раз дороже стоимости 1 тонны ДТ»
    max_dose_kg_t: 30.0        # «до 3 %»
    cetane_gain_max: 10.0      # насыщение отклика, единиц ЦЧ — допущение
    dose_scale_kg_t: 2.5       # доза, дающая 63 % насыщения — допущение
  B:
    label: "вторая присадка — свойств в пакете нет"
    enabled: false             # слот со схемы организаторов; без данных не включаем
    price_rel_per_t: 100.0
    max_dose_kg_t: 30.0
    cetane_gain_max: 0.0
    dose_scale_kg_t: 1.0

grid_step_pct: 5               # шаг перебора долей компонентов

# Серный бюджет: сколько серы в гидроочищенном ДТ резервуар доведёт до нормы. Его агент
# смеси сообщает гидроочистке, и жёсткая проверка режима идёт уже по нему, а не по 10 мг/кг.
budget:
  # Запас вводился, когда жёсткая проверка шла по среднему. С 20.09 она идёт по p95,
  # то есть по верхней границе интервала, и консерватизм уже встроен в саму проверку.
  # Сложение двух запасов заставляло систему вмешиваться в нормальном режиме.
  margin_mg_kg: 0.0
  max_dilution_share: 0.3      # не больше 30 % разбавителя в партии — допущение
