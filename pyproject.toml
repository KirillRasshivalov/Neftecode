[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neftecode"
version = "0.1.0"
description = "Multi-agent decision support for diesel production (AVT → hydrotreating → blending)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "pydantic>=2.5.0",
  "PyYAML>=6.0.1",
  "openpyxl>=3.1.2",
  "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.109.0", "uvicorn>=0.27.0"]
ml = ["scikit-learn>=1.4.0", "joblib>=1.3.0"]
dev = ["pytest>=7.4.0"]

[project.scripts]
neftecode = "neftecode.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
